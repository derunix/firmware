; M5Stack Cardputer Advanced + Cap LoRa868 (SX1262 + ATGM336H-6N)
; ESP32-S3FN8 @ 240 MHz – 8 MB flash – ST7789V2 240×135 – 56-key kbd

[cardputer_adv_base]
extends = esp32s3_base
board = cardputer_adv
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D M5STACK_CARDPUTER_ADV
  -D OLED_RU
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_cardputer_adv
  ; ── Battery current model ───────────────────────────────────────────────
  -D BAT_BASE_CURRENT_MA=55.0f
  -D BAT_TX_CURRENT_MA=145.0f
  -D BAT_GPS_CURRENT_MA=80.0f
  -D BAT_WIFI_CURRENT_MA=90.0f
  ; ── Hybrid positioning (Wi-Fi + GNSS) ──────────────────────────────────
  -D WIFI_GEO_SCAN_INTERVAL_MS=60000
  -D WIFI_GEO_SCAN_TOP_N=12
  -D WIFI_GEO_SCAN_WHEN_RADIO_OFF=1
  -D HYBRIDPOS_MIN_UPDATE_INTERVAL_MS=30000
  -D ENABLE_WIFI_DB_LEARNING=1
  -D MAX_WIFI_DB_RECORDS=512
  -D ENABLE_REMOTE_WIFI_GEO=0
  -D REMOTE_GEO_URL="\"https://www.googleapis.com/geolocation/v1/geolocate\""
  -D REMOTE_GEO_API_KEY="\"\""
  -D GNSS_REQUIRED_HDOP=200
  -D GNSS_MIN_SATS=4
  -D GNSS_LEARNING_MAX_HDOP=150
  -D GNSS_LEARNING_MAX_SPEED_MPS=3
  -D LAST_KNOWN_MAX_AGE_SEC=3600
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
  https://github.com/meshtastic/st7789/archive/9ee76d6b18b9a8f45a2c5cae06b1134a587691eb.zip
  # renovate: datasource=custom.pio depName=ESP8266Audio packageName=earlephilhower/library/ESP8266Audio
  earlephilhower/ESP8266Audio@1.9.9
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0
  # renovate: datasource=custom.pio depName=NeoPixel packageName=adafruit/library/Adafruit NeoPixel
  adafruit/Adafruit NeoPixel@1.15.2

[env:m5stack-cardputer-adv]
custom_meshtastic_hw_model = 112
custom_meshtastic_hw_model_slug = M5STACK_CARDPUTER_ADV
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = M5Stack Cardputer Advanced
custom_meshtastic_tags = M5Stack
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = cardputer_adv_base
build_flags =
  ${cardputer_adv_base.build_flags}
